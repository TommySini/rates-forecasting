[project]
name = "rates-forecasting"
version = "0.1.0"
description = "Auditable point-in-time FOMC forecasting research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<1.9",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
rates = "rates_forecasting.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

